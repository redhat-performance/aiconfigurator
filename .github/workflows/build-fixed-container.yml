name: Build fixed container image

on:
  push:
    branches: [fixed_container]
  workflow_dispatch:

concurrency:
  group: build-fixed-container
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile.service
          push: true
          tags: ghcr.io/redhat-performance/aiconfigurator:fixed_container
          cache-from: type=gha
          cache-to: type=gha,mode=max
